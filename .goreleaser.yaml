version: 2

project_name: restor
before:
  hooks:
    # CI already enforces a tidy go.mod; verify only, never rewrite the tree mid-release.
    - go mod verify

builds:
  - id: restor-multi-arch
    main: .
    binary: restor
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    # v1 runs on every x86-64 CPU (v3 needs AVX2, missing on many NAS/Celeron boxes).
    goamd64:
      - v1
    goarm:
      - 7
    goarm64:
      - v8.0
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # CommitDate (not Date) keeps rebuilds of the same tag byte-identical.
    ldflags:
      - >-
        -s -w
        -X github.com/dombyte/restor/cmd.Version={{ .Version }}
        -X github.com/dombyte/restor/cmd.GitCommit={{ .ShortCommit }}
        -X github.com/dombyte/restor/cmd.BuildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - example/config.yaml
      - example/restor.env
      - example/restor.service
      - example/restor.timer

changelog:
  sort: asc
  use: git
  abbrev: 7
  filters:
    exclude:
      - "^Merge (branch|pull request|remote-tracking branch)"
      - '^Revert "'
      - "^WIP"
  # Commit subjects follow Conventional Commits (see AGENTS.md "Commits"). A commit lands
  # in the first group (list order) whose regexp matches; "order" sets the display order.
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Dependencies
      regexp: '^\w+\(deps\):'
      order: 6
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Refactoring
      regexp: '^refactor(\(.+\))?:'
      order: 4
    - title: Documentation
      regexp: '^docs(\(.+\))?:'
      order: 5
    - title: Maintenance
      regexp: '^(chore|build|ci|test|style)(\(.+\))?:'
      order: 7
    # Only for subjects without a type (commits from before the convention).
    - title: Other changes
      order: 999

release:
  github:
    owner: dombyte
    name: restor
  name_template: "v{{ .Version }}"
  prerelease: auto
  header: |
    {{- if .Prerelease }}
    > [!WARNING]
    > **This is a pre-release version. Use with caution and report any issues you encounter.**
    {{- end }}

checksum:
  name_template: "checksums.txt"
