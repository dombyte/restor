# Settings for the example hooks in this directory.
# ===================================================================
#
# A shell file that the hooks source: KEY=value per line, quote values with spaces.
# Unlike restor.env it IS shell syntax, so "$" is expanded: quote such values in '...'.
# The hooks read /etc/restor/hooks.conf; set RESTOR_HOOKS_CONF in the environment of
# restor (e.g. Environment= in the systemd unit) to use another file.
# It holds tokens: chmod 600. Hooks never see restor.env, so keep the two apart.

# ------------------------------------------------------------------------------
# ntfy.sh, notifyapp.sh, mail.sh: which results to report.
# ------------------------------------------------------------------------------
# info: everything (started, backed up, unchanged); warning: incomplete and failed
# backups; error: failed backups only.
NOTIFY_LEVEL=info

# ------------------------------------------------------------------------------
# ntfy.sh: push notifications through ntfy (ntfy.sh or self-hosted).
# ------------------------------------------------------------------------------
# The topic URL; anyone who knows a topic on ntfy.sh can read it, so pick a long one.
NTFY_URL=
# An access token for a protected topic (tk_...).
# NTFY_TOKEN=

# ------------------------------------------------------------------------------
# notifyapp.sh: push notifications to the Notify app (getnotifyapp.com).
# ------------------------------------------------------------------------------
# The device ID (or group ID, GRP...) and its token, both shown in the app.
NOTIFYAPP_ID=
NOTIFYAPP_TOKEN=

# ------------------------------------------------------------------------------
# mail.sh: mail through the local sendmail.
# ------------------------------------------------------------------------------
MAIL_TO=
# MAIL_FROM=restor@example.com

# ------------------------------------------------------------------------------
# healthchecks.sh: Healthchecks (healthchecks.io or self-hosted), one check per job.
# ------------------------------------------------------------------------------
# The project's ping key (project settings → "Ping key"). The job name is the check's
# slug; HC_CREATE=1 creates a missing check on its first ping.
HC_PING_KEY=
# HC_URL=https://hc-ping.com
# HC_CREATE=1
