# restor - restic backup orchestrator - configuration reference (format version 2)
# ==============================================================================
#
# Every option is shown here, with its default. Copy the file and keep what you need:
#   cp example/config.yaml /etc/restor/config.yaml
#   restor validate --config /etc/restor/config.yaml
#
# Rules that apply to the whole file:
#   - YAML only (.yaml or .yml). An unknown key is an error, so a typo never goes unnoticed.
#   - Durations are strings with a unit: "30s", "5m", "4h".
#   - $VAR, ${VAR} and ${VAR:-default} in values are replaced from restor's own process
#     environment when the file is loaded; write $$ for a literal $.
#   - Relative paths (env_file, compose_file, sources, exclude_file) are resolved against
#     the directory of this file; "~" is not expanded (use $HOME). Hooks are commands and
#     are not resolved: use absolute paths (under systemd the working directory is /).
#   - YAML anchors and merge keys work: put shared blocks under a top-level key starting
#     with "x-" and merge them into jobs with "<<: *name" (see the mail job).

# Format version of this file. Required.
version: 2

# Shared settings for jobs, merged with "<<: *quick-units". Keys starting with "x-" are
# ignored by restor; they only hold anchors.
x-quick-units: &quick-units
  type: systemd
  stop_timeout: 30s
  start_timeout: 1m

# How many jobs run at the same time. 1 (default) runs one job after another, 0 runs all
# at once. Jobs that share a compose file or a systemd unit never run at the same time,
# and before/after (see the jobs) always holds, whatever the concurrency.
concurrency: 1

# ------------------------------------------------------------------------------
# Repository: where all jobs back up to, and the settings of every restic call.
# ------------------------------------------------------------------------------
repository:
  # The restic repository (passed as RESTIC_REPOSITORY, so it never shows up in logs).
  # Leave it empty to use RESTIC_REPOSITORY or RESTIC_REPOSITORY_FILE from env_file.
  #   local: /srv/restic-repo        sftp: sftp:user@host:/srv/repo
  #   s3:    s3:https://s3.amazonaws.com/bucket        b2: b2:bucket:/path
  #   rest:  rest:https://user:pass@host:8000/repo     (prefer the env file for passwords)
  url: s3:https://s3.amazonaws.com/your-backups

  # Variables for restic only (not for hooks or service managers): the password and the
  # backend credentials. One KEY=value per line, values are taken literally (a "$" in a
  # password stays a "$"). Keep it private: chmod 600 (restor warns otherwise).
  # restic's own variables work here too: RESTIC_CACHE_DIR, RESTIC_COMPRESSION,
  # RESTIC_PACK_SIZE, RESTIC_READ_CONCURRENCY, ... (see example/restor.env).
  env_file: restor.env

  # Backend options, passed to every restic call as --option=key=value.
  backend_options:
    s3.connections: "10"

  # Bandwidth limits in KiB/s for every restic call; 0 (default) is unlimited.
  limit_upload: 0
  limit_download: 0

  # Wait up to this long for a repository that another host or process has locked,
  # instead of failing at once. Default: do not wait.
  retry_lock: 10m

  # Run "restic prune" (and "unlock") once after all jobs. It only runs when every job of
  # the run has a complete snapshot, so a broken run never removes data.
  # Forgetting old snapshots does not depend on this: every job with "keep" is forgotten
  # after its own complete backup.
  prune: true

  # How much unused space prune may leave in the repository: "5%" (restic's default),
  # a size such as "2G", or "unlimited" (fastest prune).
  max_unused: 5%

# Run-level hooks: commands that run once after the run (after forget and prune).
#   post:       after every run
#   on_failure: after post, when a job, forget, prune or unlock failed
# Both get a summary of the run in their environment:
#   RESTOR_HOOK (post or on_failure); RESTOR_STATUS: failed when anything failed,
#   incomplete when a snapshot is incomplete, else success; the comma-separated job names
#   RESTOR_JOBS, RESTOR_SUCCEEDED_JOBS, RESTOR_INCOMPLETE_JOBS, RESTOR_FAILED_JOBS;
#   RESTOR_SNAPSHOT_IDS (job=ID, comma-separated) and, when anything failed,
#   RESTOR_ERROR (all failures, "; "-separated).
# E.g. one notification per run with every job's result (example/hooks/: ntfy.sh,
# notifyapp.sh, mail.sh, healthchecks.sh). Default: none.
# post: /etc/restor/hooks/ntfy.sh
# on_failure: /usr/local/bin/page-oncall

# ------------------------------------------------------------------------------
# Defaults: apply to every job that does not set the same key itself. A job's value
# replaces the default; lists are replaced as a whole, not merged.
# ------------------------------------------------------------------------------
defaults:
  # Stop the job's services during its backup (only for jobs with a type). Default: true.
  stop: true

  # After the backup, also start the job's services that were not running when it began
  # (only for jobs with a type). A failed start of those is a warning only. Compose
  # `start` does not create removed containers, and one-shot services would run again:
  # list `services` when the project has some. Default: false.
  start_all: false

  # How long to wait for the services to stop / start again. Defaults: 1m and 2m.
  stop_timeout: 1m
  start_timeout: 2m

  # Cancel restic when a backup takes longer; the services are started again and the job
  # fails. Protects against a backup that hangs while the services are down.
  # Default: no limit.
  backup_timeout: 6h

  # Retention: which snapshots "restic forget" keeps, per job and per host. A job without
  # keep is never forgotten. All keys are optional:
  #   last, hourly, daily, weekly, monthly, yearly: numbers of snapshots
  #   within, within_hourly, within_daily, within_weekly, within_monthly, within_yearly:
  #     restic durations such as "30d", "1y6m"
  #   tags: keep every snapshot with one of these tags (only next to another rule:
  #     alone, restic would forget every other snapshot, also the newest; and not a tag
  #     from the job's tags, which every snapshot of the job has)
  keep:
    daily: 7
    weekly: 4
    monthly: 6

  # What restic leaves out (each maps to the restic option of the same name):
  exclude: ["*.tmp", "*.swp"]      # --exclude, patterns
  iexclude: []                     # --iexclude, case-insensitive patterns
  exclude_file: []                 # --exclude-file, files with one pattern per line
  exclude_if_present: [.nobackup]  # --exclude-if-present, skip directories with this file
  exclude_caches: true             # --exclude-caches, skip directories with CACHEDIR.TAG
  exclude_larger_than: 2G          # --exclude-larger-than, a size such as 500M or 2G
  one_file_system: false           # --one-file-system, do not cross mount points

  # Do not create a snapshot when nothing changed. Default: false.
  skip_if_unchanged: false

  # Extra snapshot tags; the job name is always a tag. A tag must not be the name of a
  # job (forgetting that job would also select these snapshots).
  tags: []

  # Hooks: commands split on spaces and run without a shell (no quotes, pipes or
  # redirects; use a script for more). They get these variables in their environment:
  #   RESTOR_JOB, RESTOR_HOOK (pre, post, on_failure), and for post and on_failure also
  #   RESTOR_STATUS (success, incomplete, failed), RESTOR_SNAPSHOT_ID, RESTOR_ERROR.
  #   pre:        before the services are stopped; if it fails the job fails and its
  #               services are not touched
  #   post:       after the services are started again, whenever pre succeeded (also
  #               after a failed backup or a cancel, so it can undo pre; after a
  #               cancel it gets at most one minute)
  #   on_failure: after post, when the job failed
  # example/hooks/ has scripts to start from: as pre and post hook here, ntfy.sh (or
  # notifyapp.sh) reports the start and the result of every job.
  # pre: /etc/restor/hooks/ntfy.sh
  # post: /etc/restor/hooks/ntfy.sh
  # on_failure: /usr/local/bin/cleanup-after-failure.sh

# ------------------------------------------------------------------------------
# Jobs. The name is case-insensitive and its lowercase form is the restic tag; it must not
# start with "-" or contain "," or whitespace.
#
#   type:      docker-compose, podman-compose or systemd; leave it out for files only
#   sources:   paths to back up (required)
#   before / after: names of jobs that must run after / before this one. A job waits
#              until those have finished, whether they succeeded or not.
#   plus every key of the defaults section.
#
# docker-compose / podman-compose:
#   compose_file: the compose file (required); with a default name (compose.yaml, …) its
#                 override file (compose.override.yml, …) is used too, as Compose does
#   services:     services to stop; default: every service of the compose file
# systemd:
#   units:        units to stop (required)
#   services:     a subset of units to stop; default: all units
#   scope:        system (default) or user
# Only the services that are running when the backup starts are stopped and started again.
# ------------------------------------------------------------------------------
jobs:
  # The database first: web waits for it (db names web in before).
  db:
    type: docker-compose
    compose_file: /srv/app/compose.yml
    services: [db]
    sources: [/srv/app/db]
    before: [web]

  # Same compose file, other services: runs after db, so the two never collide.
  web:
    type: docker-compose
    compose_file: /srv/app/compose.yml
    services: [web, worker]
    sources: [/srv/app/uploads, /srv/app/config]
    exclude: ["*.tmp", "cache/"]
    keep: {daily: 30, weekly: 12}
    tags: [prod]
    # pre: /usr/local/bin/app-maintenance-on
    # post: /usr/local/bin/app-maintenance-off

  # Podman Compose, backed up while it keeps running.
  wiki:
    type: podman-compose
    compose_file: /srv/wiki/compose.yml
    stop: false
    # Make sure the wiki is up after each backup, also when it was down before.
    start_all: true
    sources: [/srv/wiki/data]

  # systemd units of the system (scope: system is the default), with shared settings
  # merged from the x-quick-units anchor below.
  mail:
    <<: *quick-units
    units: [postfix.service, dovecot.service]
    sources: [/var/mail, /etc/postfix, /etc/dovecot]
    after: [db]

  # systemd user units of the user running restor.
  syncthing:
    type: systemd
    units: [syncthing.service]
    scope: user
    sources: [/home/backup/Sync]

  # Files only: no services are stopped.
  etc:
    sources: [/etc]
    one_file_system: true
    keep: {within: 90d, monthly: 12}
